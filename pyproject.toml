[project]
name = "sofa"
version = "0.1.0"
description = "SOFA voice commerce backend (Powered by N-ATLAS)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "psycopg[binary]>=3.1",
  "jinja2>=3.1",
  "itsdangerous>=2.1",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
redis = ["redis>=5"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["sofa*", "mocks*"]

[tool.setuptools.package-data]
sofa = ["web/templates/*.html", "dialogue/translations.json"]
